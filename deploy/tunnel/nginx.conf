# TLS front for the inhook tunnel vhost. frps serves tunneled HTTP on
# 127.0.0.1:8080 (see frps.toml); nginx terminates TLS for the wildcard
# domain. Requires a wildcard certificate for *.t.inhook.mrinal.xyz
# (see README.md).

server {
    listen 80;
    server_name *.t.inhook.mrinal.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.t.inhook.mrinal.xyz;

    ssl_certificate     /etc/letsencrypt/live/t.inhook.mrinal.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t.inhook.mrinal.xyz/privkey.pem;

    # Webhook payloads can be sizable, but cap them.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # frps routes by Host header - forwarding it unchanged is required.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
